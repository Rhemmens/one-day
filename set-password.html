<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7e9279"><title>One Day · Set Password</title><style>:root{--sage:#7e9279;--cream:#f7f3e8;--ink:#282b26;--line:#e8e8e1}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(420px,100%);background:#fff;border:1px solid #e5e0d4;border-radius:26px;padding:26px}.logo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#fff;font:700 24px Georgia}.eyebrow{font-size:10px;letter-spacing:.15em;color:#5f765a;font-weight:700}.muted{color:#787b72;line-height:1.5}h1{font-family:Georgia,serif}.stack{display:grid;gap:10px}.stack input{border:1px solid var(--line);border-radius:11px;padding:12px;font-size:16px}.btn{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:46px;padding:0 14px;font-weight:700}.primary{background:var(--sage);color:#fff;border-color:var(--sage)}.note{background:var(--cream);border-left:3px solid #b99a4a;border-radius:4px 16px 16px 4px;padding:14px;margin:16px 0}</style></head><body><div class="box"><div class="logo">1</div><p class="eyebrow">ONE DAY</p><h1 id="title">Set your password.</h1><p class="muted" id="copy">Enter your email and we'll send you a private password setup link.</p><div id="request" class="stack"><input id="email" type="email" autocomplete="email" placeholder="Email"><button class="btn primary" onclick="sendSetup()">Send password setup email</button></div><div id="change" class="stack" style="display:none"><input id="password" type="password" autocomplete="new-password" placeholder="Choose a password"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm password"><button class="btn primary" onclick="savePassword()">Save password</button></div><div id="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script>const sb=window.supabase.createClient('https://nnzlaczbomzyfmpkyllo.supabase.co','sb_publishable_6w69fwX96lRZpDkbjcEDCA_ptMCU26u',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const msg=t=>document.getElementById('msg').innerHTML='<div class="note">'+t+'</div>';function showChange(){document.getElementById('request').style.display='none';document.getElementById('change').style.display='grid';document.getElementById('title').textContent='Choose your password.';document.getElementById('copy').textContent='This password stays private and is only used to sign in to One Day.'}async function sendSetup(){const email=document.getElementById('email').value.trim().toLowerCase();if(!email){msg('Enter your email first.');return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href.split('#')[0].split('?')[0]});msg(error?error.message:'Email sent. Open the One Day password email on this phone.')}async function savePassword(){const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<6){msg('Use at least 6 characters.');return}if(p!==c){msg('Passwords do not match.');return}const{error}=await sb.auth.updateUser({password:p});if(error){msg(error.message);return}msg('Password saved. You can now sign in to One Day with your email and this password.')}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)showChange()});sb.auth.getSession().then(({data})=>{if(data.session)showChange()});</script></body></html>
