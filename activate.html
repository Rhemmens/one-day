<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7e9279"><title>Activate One Day</title><style>body{margin:0;background:#f7f3e8;color:#282b2a;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:white;border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,.08)}h1{font-family:Georgia,serif;font-size:38px;margin:0 0 8px}.eyebrow{letter-spacing:.16em;font-size:11px;font-weight:700;color:#7e9279}.muted{color:#6d716d}.stack{display:grid;gap:12px;margin-top:18px}input,button,a{font:inherit;padding:14px 15px;border-radius:14px}input{border:1px solid #d7ddd3}button,.app{background:#7e9279;color:white;border:0;font-weight:700;text-align:center;text-decoration:none}.note{margin-top:14px;padding:12px;border-radius:12px;background:#f7f3e8}.ok{color:#446142}.err{color:#8c3f3f}</style></head><body><div class="wrap"><div class="card"><p class="eyebrow">ONE DAY</p><h1>Activate your account</h1><p class="muted">You were invited by your coach. Choose your own password to activate One Day.</p><div class="stack"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="pw" type="password" autocomplete="new-password" placeholder="Choose password"><input id="pw2" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="go">Create account</button></div><div id="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script>const sb=window.supabase.createClient('https://nnzlaczbomzyfmpkyllo.supabase.co','sb_publishable_6w69fwX96lRZpDkbjcEDCA_ptMCU26u',{auth:{persistSession:true,autoRefreshToken:true}});const qs=new URLSearchParams(location.search);document.getElementById('email').value=(qs.get('email')||'').trim().toLowerCase();const m=document.getElementById('msg');const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('go').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;m.innerHTML='';if(!email||pw.length<6){m.innerHTML='<div class="note err">Use a valid email and at least 6 characters.</div>';return}if(pw!==pw2){m.innerHTML='<div class="note err">Passwords do not match.</div>';return}const b=document.getElementById('go');b.disabled=true;b.textContent='Creating…';const{data,error}=await sb.auth.signUp({email,password:pw});if(error){m.innerHTML='<div class="note err">'+e(error.message)+'</div>';b.disabled=false;b.textContent='Create account';return}if(!data.session){m.innerHTML='<div class="note">Account created. Check the newest confirmation email if one arrives, then sign in to One Day.</div>';return}const{data:p}=await sb.from('profiles').select('role,coach_id').eq('id',data.user.id).maybeSingle();if(!p||p.role!=='client'||!p.coach_id){await sb.auth.signOut();m.innerHTML='<div class="note err">No pending coach invitation was found for this email.</div>';b.disabled=false;b.textContent='Create account';return}m.innerHTML='<div class="note ok">Account activated. You can now open One Day and sign in.</div><div class="stack"><a class="app" href="https://raw.githack.com/Rhemmens/one-day/main/index.html">Open One Day</a></div>'};</script></body></html>
