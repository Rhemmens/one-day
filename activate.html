<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7e9279"><title>Activate One Day</title><style>body{margin:0;background:#f7f3e8;color:#282b2a;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:white;border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,.08)}h1{font-family:Georgia,serif;font-size:38px;margin:0 0 8px}.eyebrow{letter-spacing:.16em;font-size:11px;font-weight:700;color:#7e9279}.muted{color:#6d716d}.stack{display:grid;gap:12px;margin-top:18px}input,button{font:inherit;padding:14px 15px;border-radius:14px;border:1px solid #d7ddd3}button{background:#7e9279;color:white;border:0;font-weight:700}.note{margin-top:14px;padding:12px;border-radius:12px;background:#f7f3e8}.ok{color:#446142}.err{color:#8c3f3f}</style></head><body><div class="wrap"><div class="card"><p class="eyebrow">ONE DAY</p><h1>Activate your account</h1><p class="muted">Invited clients create their own password here. Your password stays private.</p><div class="stack"><input id="email" type="email" autocomplete="email" value="swimreece@gmail.com" placeholder="Email"><input id="pw" type="password" autocomplete="new-password" placeholder="Choose password"><input id="pw2" type="password" autocomplete="new-password" placeholder="Confirm password"><button id="go">Create account</button></div><div id="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script>const sb=window.supabase.createClient('https://nnzlaczbomzyfmpkyllo.supabase.co','sb_publishable_6w69fwX96lRZpDkbjcEDCA_ptMCU26u',{auth:{persistSession:true,autoRefreshToken:true}});const m=document.getElementById('msg');document.getElementById('go').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('pw').value,pw2=document.getElementById('pw2').value;m.innerHTML='';if(!email||pw.length<6){m.innerHTML='<div class="note err">Use a valid email and at least 6 characters.</div>';return}if(pw!==pw2){m.innerHTML='<div class="note err">Passwords do not match.</div>';return}document.getElementById('go').disabled=true;document.getElementById('go').textContent='Creating…';const {data,error}=await sb.auth.signUp({email,password:pw});if(error){m.innerHTML='<div class="note err">'+error.message+'</div>';document.getElementById('go').disabled=false;document.getElementById('go').textContent='Create account';return}if(!data.session){m.innerHTML='<div class="note">Account created. If Supabase asks for email confirmation, use the newest email, then return to One Day.</div>';return}const {data:p}=await sb.from('profiles').select('role,coach_id').eq('id',data.user.id).maybeSingle();if(!p||p.role!=='client'||!p.coach_id){m.innerHTML='<div class="note err">This email is not attached to a pending Maddie invite.</div>';return}m.innerHTML='<div class="note ok">Account activated. Opening One Day…</div>';setTimeout(()=>location.href='https://raw.githack.com/Rhemmens/one-day/277df87b0352d7f8401bbb4052aa4ca2f22b58c4/index.html',700)};</script></body></html>
